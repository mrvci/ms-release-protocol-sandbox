name: "Release · 08 — CCD → Production"
run-name: "CCD → Production — ${{ inputs.version || 'latest train' }}"

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Train version (blank = latest open train)"
        required: false

permissions:
  contents: read
  issues: write

jobs:
  ccd-prod:
    name: "Promote remote content dev → prod + pin badges"
    runs-on: ubuntu-latest
    environment: ccd-production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/github-script@v7
        env:
          ACTION: ccd-prod
          VERSION: ${{ inputs.version }}
        with:
          script: |
            const run = require(process.env.GITHUB_WORKSPACE + '/.github/scripts/train.js')
            await run({ github, context, core })
