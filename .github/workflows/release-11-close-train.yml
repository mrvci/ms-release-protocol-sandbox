name: "Release · 11 — Close train"
run-name: "Close train — ${{ inputs.version || 'latest train' }}"

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Train version (blank = latest open train)"
        required: false
      next_version:
        description: "Next train version (e.g. 1.18)"
        required: true
        default: "1.18"
      next_rc_exists:
        description: "Does the next RC branch already exist? (devs pre-create them sometimes)"
        required: true
        type: boolean
        default: true

permissions:
  contents: read
  issues: write

jobs:
  close-train:
    name: "Merge RC to main + next RC, delete branches"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/github-script@v7
        env:
          ACTION: close-train
          VERSION: ${{ inputs.version }}
          NEXT_VERSION: ${{ inputs.next_version }}
          NEXT_RC_EXISTS: ${{ inputs.next_rc_exists }}
        with:
          script: |
            const run = require(process.env.GITHUB_WORKSPACE + '/.github/scripts/train.js')
            await run({ github, context, core })
