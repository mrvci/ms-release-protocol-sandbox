name: "Release · 02 — Dev-complete gate"
run-name: "Dev-complete gate — ${{ inputs.version || 'latest train' }}"

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Train version (blank = latest open train)"
        required: false

permissions:
  contents: read
  issues: write

jobs:
  dev-complete:
    name: "Confirm all release dev is finished and merged"
    runs-on: ubuntu-latest
    environment: dev-complete
    steps:
      - uses: actions/checkout@v4
      - uses: actions/github-script@v7
        env:
          ACTION: dev-complete
          VERSION: ${{ inputs.version }}
        with:
          script: |
            const run = require(process.env.GITHUB_WORKSPACE + '/.github/scripts/train.js')
            await run({ github, context, core })
