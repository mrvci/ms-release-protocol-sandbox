name: "Release · 10 — Rollout (Android)"
run-name: "Android rollout → ${{ inputs.percent }}% — ${{ inputs.version || 'latest train' }}"

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Train version (blank = latest open train)"
        required: false
      percent:
        description: "Rollout percentage on the Play production track"
        required: true
        type: choice
        options:
          - "10"
          - "25"
          - "50"
          - "100"
        default: "10"

permissions:
  contents: read
  issues: write

jobs:
  rollout-android:
    name: "Ramp Play rollout"
    runs-on: ubuntu-latest
    environment: rollout-android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/github-script@v7
        env:
          ACTION: rollout-android
          PERCENT: ${{ inputs.percent }}
          VERSION: ${{ inputs.version }}
        with:
          script: |
            const run = require(process.env.GITHUB_WORKSPACE + '/.github/scripts/train.js')
            await run({ github, context, core })
