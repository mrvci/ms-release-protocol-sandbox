name: "Release · 03 — Pre-flight & candidate build"
run-name: "Pre-flight & candidate build — ${{ inputs.version || 'latest train' }}"

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Train version (blank = latest open train)"
        required: false
      android_build:
        description: "Android build number"
        required: true
        default: "637"
      ios_build:
        description: "iOS build number"
        required: true
        default: "632"

permissions:
  contents: read
  issues: write

jobs:
  preflight-and-build:
    name: "Run pre-flight gates, then trigger VGCI"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/github-script@v7
        env:
          ACTION: preflight-build
          VERSION: ${{ inputs.version }}
          ANDROID_BUILD: ${{ inputs.android_build }}
          IOS_BUILD: ${{ inputs.ios_build }}
        with:
          script: |
            const run = require(process.env.GITHUB_WORKSPACE + '/.github/scripts/train.js')
            await run({ github, context, core })
