name: "Release · 11 — Rollout (iOS)"
run-name: "iOS rollout — ${{ inputs.action }} — ${{ inputs.version || 'latest train' }}"

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Train version (blank = latest open train)"
        required: false
      action:
        description: "iOS phased release action (Apple controls the daily curve)"
        required: true
        type: choice
        options:
          - start-phased-release
          - release-to-all
        default: start-phased-release

permissions:
  contents: read
  issues: write

jobs:
  rollout-ios:
    name: "iOS phased release"
    runs-on: ubuntu-latest
    environment: rollout-ios
    steps:
      - uses: actions/checkout@v4
      - uses: actions/github-script@v7
        env:
          ACTION: rollout-ios
          ROLLOUT_ACTION: ${{ inputs.action }}
          VERSION: ${{ inputs.version }}
        with:
          script: |
            const run = require(process.env.GITHUB_WORKSPACE + '/.github/scripts/train.js')
            await run({ github, context, core })
