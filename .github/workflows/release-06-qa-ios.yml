name: "Release · 06 — QA sign-off (iOS)"
run-name: "QA sign-off (iOS) — ${{ inputs.version || 'latest train' }}"

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Train version (blank = latest open train)"
        required: false

permissions:
  contents: read
  issues: write

jobs:
  qa-ios:
    name: "Approve QA pass (iOS)"
    runs-on: ubuntu-latest
    environment: qa-signoff-ios
    steps:
      - uses: actions/checkout@v4
      - uses: actions/github-script@v7
        env:
          ACTION: qa
          PLATFORM: ios
          VERSION: ${{ inputs.version }}
        with:
          script: |
            const run = require(process.env.GITHUB_WORKSPACE + '/.github/scripts/train.js')
            await run({ github, context, core })
